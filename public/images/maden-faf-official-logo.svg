<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 600" width="100%" height="100%" aria-label="MADEN FAF Official Logo">
  <defs>
    <!-- Gradients -->
    <radialGradient id="navyBgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#142B58" />
      <stop offset="65%" stop-color="#0A1838" />
      <stop offset="100%" stop-color="#050C1D" />
    </radialGradient>
    
    <linearGradient id="goldOuterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="25%" stop-color="#EAB308" />
      <stop offset="70%" stop-color="#CA8A04" />
      <stop offset="100%" stop-color="#854D0E" />
    </linearGradient>

    <linearGradient id="goldInnerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <linearGradient id="silverWingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#E2E8F0" />
      <stop offset="85%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <linearGradient id="shieldBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="80%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.35" />
    </filter>

    <filter id="starGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#CA8A04" flood-opacity="0.6" />
    </filter>

    <!-- Curved Text Paths -->
    <!-- Center is 300, 300. Radius 240 for top text -->
    <path id="topTextArc" d="M 90,300 A 210,210 0 0,1 510,300" fill="none" />
    <!-- Center is 300, 300. Radius 240 for bottom text -->
    <path id="bottomTextArc" d="M 510,300 A 210,210 0 0,1 90,300" fill="none" />
    
    <!-- Clip path for central tricolor shield -->
    <clipPath id="shieldClip">
      <path d="M 195,178 L 405,178 L 405,400 Q 405,482 300,528 Q 195,482 195,400 Z" />
    </clipPath>

    <!-- Clip path for circular stadium panorama -->
    <clipPath id="panoramaClip">
      <circle cx="300" cy="316" r="76" />
    </clipPath>
  </defs>

  <!-- ==================== OUTER RINGS ==================== -->
  <!-- 1. Outermost Navy Rim -->
  <circle cx="300" cy="300" r="290" fill="#0A1838" stroke="#CA8A04" stroke-width="6" />

  <!-- 2. Outer Gold Ring -->
  <circle cx="300" cy="300" r="282" fill="none" stroke="url(#goldOuterGrad)" stroke-width="4" />

  <!-- 3. White Annulus Ring for Text -->
  <circle cx="300" cy="300" r="275" fill="#FFFFFF" />

  <!-- Dynamic Speed Stripes on White Ring (Left & Right) -->
  <g opacity="0.95">
    <!-- Right side chevron lines -->
    <line x1="420" y1="365" x2="480" y2="330" stroke="#0A1838" stroke-width="4.5" stroke-linecap="round" />
    <line x1="432" y1="382" x2="495" y2="345" stroke="#CA8A04" stroke-width="5" stroke-linecap="round" />
    <line x1="440" y1="402" x2="510" y2="360" stroke="#0A1838" stroke-width="4.5" stroke-linecap="round" />
    <line x1="446" y1="424" x2="520" y2="380" stroke="#CA8A04" stroke-width="3.5" stroke-linecap="round" />
    <line x1="452" y1="446" x2="524" y2="402" stroke="#0A1838" stroke-width="4" stroke-linecap="round" />
    <!-- Left side subtle accents -->
    <line x1="180" y1="130" x2="120" y2="165" stroke="#0A1838" stroke-width="4" stroke-linecap="round" />
    <line x1="168" y1="148" x2="105" y2="185" stroke="#CA8A04" stroke-width="4.5" stroke-linecap="round" />
  </g>

  <!-- 4. Inner Navy Ring Separator -->
  <circle cx="300" cy="300" r="200" fill="none" stroke="#0A1838" stroke-width="5" />
  <circle cx="300" cy="300" r="196" fill="none" stroke="url(#goldInnerGrad)" stroke-width="3" />

  <!-- ==================== RING TYPOGRAPHY & STARS ==================== -->
  <!-- Top Text: MADEN -->
  <text font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" fill="#0A1838" letter-spacing="14">
    <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">
      MADEN
    </textPath>
  </text>

  <!-- Bottom Text: FOOTBALL ACADEMY -->
  <text font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#0A1838" letter-spacing="9">
    <textPath href="#bottomTextArc" startOffset="50%" text-anchor="middle">
      FOOTBALL ACADEMY
    </textPath>
  </text>

  <!-- Left Gold Star -->
  <g transform="translate(68, 300)" filter="url(#starGlow)">
    <polygon points="0,-18 5.5,-5.5 19,-5.5 8,3.5 12,17 0,8.5 -12,17 -8,3.5 -19,-5.5 -5.5,-5.5" fill="url(#goldInnerGrad)" stroke="#B45309" stroke-width="1" />
  </g>

  <!-- Right Gold Star -->
  <g transform="translate(532, 300)" filter="url(#starGlow)">
    <polygon points="0,-18 5.5,-5.5 19,-5.5 8,3.5 12,17 0,8.5 -12,17 -8,3.5 -19,-5.5 -5.5,-5.5" fill="url(#goldInnerGrad)" stroke="#B45309" stroke-width="1" />
  </g>

  <!-- ==================== INNER CIRCLE CORE ==================== -->
  <circle cx="300" cy="300" r="192" fill="url(#navyBgGrad)" />

  <!-- Brushed Metal Texture Lines inside inner core -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="120" y1="200" x2="480" y2="200" />
    <line x1="110" y1="240" x2="490" y2="240" />
    <line x1="108" y1="280" x2="492" y2="280" />
    <line x1="108" y1="320" x2="492" y2="320" />
    <line x1="110" y1="360" x2="490" y2="360" />
    <line x1="120" y1="400" x2="480" y2="400" />
  </g>

  <!-- ==================== SPREAD SILVER WINGS ==================== -->
  <!-- Left Wing -->
  <g filter="url(#dropShadow)">
    <!-- Outer Wing Wingspan -->
    <path d="M 270,178 C 240,165 200,140 152,108 C 168,128 178,144 186,162 C 172,156 160,150 148,142 C 162,160 174,174 188,188 C 178,184 168,180 158,175 C 174,192 192,204 212,212 C 198,210 186,206 176,202 C 196,218 220,226 248,228 L 272,210 Z"
          fill="url(#silverWingGrad)" stroke="#0A1838" stroke-width="3" />
    <!-- Right Wing -->
    <path d="M 330,178 C 360,165 400,140 448,108 C 432,128 422,144 414,162 C 428,156 440,150 452,142 C 438,160 426,174 412,188 C 422,184 432,180 442,175 C 426,192 408,204 388,212 C 402,210 414,206 424,202 C 404,218 380,226 352,228 L 328,210 Z"
          fill="url(#silverWingGrad)" stroke="#0A1838" stroke-width="3" />
  </g>

  <!-- Central Wing Badge / Gold Coin with "M" -->
  <g transform="translate(300, 182)" filter="url(#dropShadow)">
    <circle cx="0" cy="0" r="28" fill="url(#goldInnerGrad)" stroke="#0A1838" stroke-width="3.5" />
    <circle cx="0" cy="0" r="22" fill="#FFFFFF" stroke="#CA8A04" stroke-width="1.8" />
    <!-- Stylized Modern M Monogram -->
    <path d="M -13,11 L -13,-9 L -4,4 L 0,-2 L 4,4 L 13,-9 L 13,11 L 8.5,11 L 8.5,-0.5 L 4,6 L 0,0.5 L -4,6 L -8.5,-0.5 L -8.5,11 Z" fill="#142B58" />
    <polygon points="0,-10 -3.5,-5 3.5,-5" fill="#EAB308" />
  </g>

  <!-- ==================== CENTRAL TRICOLOR SHIELD ==================== -->
  <!-- Outer Shield Border Background -->
  <path d="M 188,172 L 412,172 L 412,402 Q 412,492 300,538 Q 188,492 188,402 Z"
        fill="#071228" stroke="url(#shieldBorderGrad)" stroke-width="7" filter="url(#dropShadow)" />
  
  <path d="M 194,177 L 406,177 L 406,400 Q 406,484 300,530 Q 194,484 194,400 Z"
        fill="#FFFFFF" stroke="#0A1838" stroke-width="2.5" />

  <!-- Clipped Tricolor Panels Inside Shield -->
  <g clip-path="url(#shieldClip)">
    <!-- Saffron / Orange Left Panel (India Tricolor) -->
    <rect x="190" y="170" width="74" height="370" fill="#FF7900" />
    <!-- White Center Panel -->
    <rect x="264" y="170" width="72" height="370" fill="#FFFFFF" />
    <!-- Green Right Panel -->
    <rect x="336" y="170" width="74" height="370" fill="#0A8838" />

    <!-- Subtle gradient overlay on shield for 3D metallic feel -->
    <rect x="190" y="170" width="220" height="370" fill="url(#navyBgGrad)" opacity="0.08" />

    <!-- ==================== CIRCULAR PANORAMA / CITYSCAPE ==================== -->
    <g transform="translate(0, 0)">
      <!-- Outer Decorative Panorama Halo / Ring -->
      <circle cx="300" cy="316" r="77" fill="#FFFFFF" stroke="#0A1838" stroke-width="3" />
      
      <!-- Architectural Ring Elements (Red, Gold, White, Green buildings) -->
      <g stroke="#0A1838" stroke-width="0.8">
        <!-- Circular ring of stylized world monuments & stadiums -->
        <!-- Top buildings -->
        <rect x="290" y="240" width="20" height="18" fill="#DC2626" />
        <polygon points="300,228 288,240 312,240" fill="#B91C1C" />
        <!-- Top right buildings -->
        <rect x="316" y="244" width="16" height="20" fill="#F59E0B" rx="1" />
        <rect x="338" y="252" width="18" height="22" fill="#E2E8F0" rx="1" />
        <polygon points="347,242 338,252 356,252" fill="#0A1838" />
        <rect x="354" y="270" width="16" height="22" fill="#DC2626" />
        <!-- Right stadium dome -->
        <path d="M 364,300 C 378,300 378,324 364,324 Z" fill="#F59E0B" />
        <rect x="356" y="324" width="16" height="24" fill="#0A8838" />
        <!-- Bottom right buildings -->
        <rect x="340" y="348" width="18" height="20" fill="#DC2626" />
        <polygon points="349,368 340,348 358,348" fill="#E2E8F0" />
        <rect x="318" y="360" width="18" height="18" fill="#F59E0B" />
        <!-- Bottom buildings -->
        <rect x="290" y="366" width="20" height="16" fill="#0A1838" />
        <!-- Bottom left buildings -->
        <rect x="264" y="360" width="18" height="18" fill="#DC2626" />
        <rect x="242" y="348" width="18" height="20" fill="#F59E0B" />
        <!-- Left stadium dome & tower -->
        <path d="M 236,324 C 222,324 222,300 236,300 Z" fill="#E2E8F0" />
        <rect x="228" y="276" width="16" height="22" fill="#0A8838" />
        <polygon points="236,266 228,276 244,276" fill="#DC2626" />
        <!-- Top left buildings -->
        <rect x="244" y="252" width="18" height="22" fill="#F59E0B" />
        <rect x="266" y="244" width="16" height="20" fill="#0A1838" />
        <polygon points="274,234 266,244 282,244" fill="#DC2626" />
      </g>

      <!-- Center White Playing Field Circle -->
      <circle cx="300" cy="316" r="44" fill="#FFFFFF" stroke="#0A1838" stroke-width="2.5" />

      <!-- Lush Green Pitch Mound -->
      <path d="M 264,334 Q 300,324 336,334 Q 300,352 264,334 Z" fill="#15803D" stroke="#0A1838" stroke-width="1.2" />

      <!-- Dynamic Football Players (Silhouette with authentic team kit colors) -->
      <!-- Player 1: Center Forward in Green Kit -->
      <g transform="translate(290, 288)">
        <!-- Head -->
        <circle cx="9" cy="4" r="3.2" fill="#0A1838" />
        <!-- Green Jersey -->
        <path d="M 3,8 L 15,8 L 17,17 L 1,17 Z" fill="#16A34A" stroke="#0A1838" stroke-width="0.7" />
        <!-- Left arm pointing -->
        <line x1="3" y1="9" x2="-2" y2="13" stroke="#0A1838" stroke-width="1.8" stroke-linecap="round" />
        <!-- Right arm dynamic -->
        <line x1="15" y1="9" x2="20" y2="12" stroke="#0A1838" stroke-width="1.8" stroke-linecap="round" />
        <!-- Black Shorts -->
        <path d="M 2,17 L 16,17 L 14,24 L 4,24 Z" fill="#0A1838" />
        <!-- Running Legs -->
        <line x1="6" y1="24" x2="2" y2="34" stroke="#0A1838" stroke-width="2.2" stroke-linecap="round" />
        <line x1="12" y1="24" x2="18" y2="33" stroke="#0A1838" stroke-width="2.2" stroke-linecap="round" />
      </g>

      <!-- Player 2: Striker / Challenger in Bright Yellow Kit -->
      <g transform="translate(306, 290)">
        <!-- Head -->
        <circle cx="7" cy="3" r="3.2" fill="#0A1838" />
        <!-- Yellow Jersey -->
        <path d="M 2,7 L 13,7 L 15,16 L 1,16 Z" fill="#FACC15" stroke="#0A1838" stroke-width="0.7" />
        <!-- Arms -->
        <line x1="2" y1="8" x2="-2" y2="13" stroke="#0A1838" stroke-width="1.8" stroke-linecap="round" />
        <line x1="13" y1="8" x2="18" y2="12" stroke="#0A1838" stroke-width="1.8" stroke-linecap="round" />
        <!-- Dark shorts & kicking leg -->
        <path d="M 2,16 L 14,16 L 13,23 L 3,23 Z" fill="#0A1838" />
        <line x1="5" y1="23" x2="2" y2="33" stroke="#0A1838" stroke-width="2.2" stroke-linecap="round" />
        <line x1="11" y1="23" x2="14" y2="32" stroke="#0A1838" stroke-width="2.2" stroke-linecap="round" />
      </g>

      <!-- Player 3: Sliding Tackler in Green/Dark Kit -->
      <g transform="translate(270, 316)">
        <circle cx="6" cy="2" r="3" fill="#0A1838" />
        <!-- Body angled -->
        <line x1="6" y1="4" x2="18" y2="10" stroke="#15803D" stroke-width="4.5" stroke-linecap="round" />
        <line x1="18" y1="10" x2="28" y2="12" stroke="#0A1838" stroke-width="2.5" stroke-linecap="round" />
      </g>

      <!-- The Football (Soccer Ball) on Pitch -->
      <g transform="translate(294, 327)">
        <circle cx="5" cy="5" r="5.5" fill="#FFFFFF" stroke="#0A1838" stroke-width="1.2" />
        <!-- Classic Black Pentagons on Ball -->
        <polygon points="5,2.5 7.2,4.2 6.3,6.8 3.7,6.8 2.8,4.2" fill="#0A1838" />
        <line x1="5" y1="2.5" x2="5" y2="0" stroke="#0A1838" stroke-width="0.8" />
        <line x1="7.2" y1="4.2" x2="9.8" y2="3.5" stroke="#0A1838" stroke-width="0.8" />
        <line x1="6.3" y1="6.8" x2="8.2" y2="9.2" stroke="#0A1838" stroke-width="0.8" />
        <line x1="3.7" y1="6.8" x2="1.8" y2="9.2" stroke="#0A1838" stroke-width="0.8" />
        <line x1="2.8" y1="4.2" x2="0.2" y2="3.5" stroke="#0A1838" stroke-width="0.8" />
      </g>
    </g>

    <!-- ==================== MADEN FAF BRAND TEXT INSIDE SHIELD ==================== -->
    <g transform="translate(300, 428)" filter="url(#dropShadow)">
      <!-- MADEN text with customized athletic stencil styling -->
      <text x="0" y="0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#0A1838" letter-spacing="4">
        MADEN
      </text>

      <!-- FAF text below MADEN -->
      <text x="0" y="34" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#0A1838" letter-spacing="8">
        FAF
      </text>

      <!-- Solid Underline Bar beneath FAF -->
      <line x1="-55" y1="44" x2="55" y2="44" stroke="#0A1838" stroke-width="5" stroke-linecap="round" />
    </g>
  </g>
</svg>